name: Build Windows x64 Wheel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  build-windows-wheel:
    # windows-latest currently maps to Windows Server 2022/2025 (x64), 
    # which produces win_amd64 wheels fully compatible with Windows 11 x64.
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.7'
          architecture: 'x64'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel

      - name: Build wheel from setup.py
        run: python -m build --wheel
      
      - name: Extract repository name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
      
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{github.event.repository.name}}-${{runner.arch}}
          path: dist/*.whl
